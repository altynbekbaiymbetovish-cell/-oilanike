<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OilaNIKE — Химия тесті</title>
<style>
:root{--b:#0b7ff1;--b2:#075caf;--w:#fff;--line:rgba(255,255,255,.4);--mut:rgba(255,255,255,.78)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(145deg,var(--b),var(--b2));background-size:82px 82px,82px 82px,auto}
.wrap{max-width:980px;margin:auto;padding:18px}.box{border:1px solid var(--line);border-radius:24px;background:rgba(0,45,110,.14);backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,35,90,.22);overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);gap:15px}.brand{display:flex;align-items:center;gap:10px}.brandname{font-size:clamp(32px,5vw,54px);font-weight:950;letter-spacing:-2px}.brandname span{font-weight:700}.sw{width:78px}.hero{padding:28px 24px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.95;letter-spacing:-3px;margin:0;font-weight:950}.hero p{font-size:clamp(18px,2.3vw,27px);color:var(--mut);margin:12px 0 0}.note{font-size:11px;color:rgba(255,255,255,.58);margin-top:15px}.panel{margin-top:18px;padding:21px;border:1px solid var(--line);border-radius:24px;background:rgba(0,45,110,.13)}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:16px}select option{color:#111}button{padding:14px 18px;border:0;border-radius:14px;font-size:16px;font-weight:850;cursor:pointer}.pri{background:#fff;color:#0764bf}.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3)}.hidden{display:none!important}.start{display:grid;grid-template-columns:1fr auto;gap:12px}.progrow{display:flex;align-items:center;gap:10px}.prog{height:9px;flex:1;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.prog div{height:100%;background:#fff;width:0;transition:.3s}.qnum{min-width:65px;text-align:right;font-weight:800}.context{margin:16px 0;padding:13px 14px;border-left:4px solid #fff;background:rgba(255,255,255,.07);border-radius:10px;color:var(--mut);line-height:1.5}.q{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.15;margin:18px 0 14px}.stem{color:var(--mut);margin-bottom:14px}.opts{display:grid;gap:11px}.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid rgba(255,255,255,.28);border-radius:16px;background:rgba(255,255,255,.07);cursor:pointer}.opt input{width:auto;margin-top:3px}.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;padding:7px 0}.fb{margin-top:15px;padding:14px 16px;border-radius:14px;font-weight:800}.ok{background:rgba(180,255,200,.13);border:1px solid rgba(180,255,200,.45)}.bad{background:rgba(255,210,210,.12);border:1px solid rgba(255,210,210,.45)}.exp{margin-top:14px;padding:18px;border:1px solid rgba(255,255,255,.26);border-radius:18px;background:rgba(255,255,255,.08)}.exp h3{margin:0 0 8px}.exp .correct{font-weight:900;margin-bottom:9px}.exp p{margin:0;line-height:1.65;color:rgba(255,255,255,.9)}.acts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.right{display:flex;gap:10px}.result{text-align:center;padding:15px}.score{font-size:clamp(64px,10vw,116px);font-weight:950;line-height:.95}.footer{text-align:center;padding:22px;color:rgba(255,255,255,.65);font-size:12px}
@media(max-width:640px){.wrap{padding:11px}.head,.hero,.panel{padding:16px}.start,.match{grid-template-columns:1fr}.meta{display:none}.sw{width:65px}}
</style></head>
<body><div class="wrap">
<section class="box">
<div class="head"><div class="brand"><div class="brandname">Oila<span>NIKE</span></div><div class="sw"><svg viewBox="0 0 120 44"><path d="M6 29c18 8 32 10 50 4 18-6 35-17 58-30-19 20-39 36-61 40C32 47 17 41 6 29Z" fill="white"/></svg></div></div><div class="meta">ХИМИЯ • 3-ай • 1-апта</div></div>
<div class="hero"><h1>Белгілеп,<br>ойланып, шыңдал.</h1><p>15 сұрақ • жауаптан кейін түсіндірме ашылады</p><div class="note">Оқу жобасы. Nike брендімен ресми байланысы жоқ.</div></div>
</section>

<section id="start" class="panel"><h2 style="margin-top:0">Тесті бастау</h2><p style="color:var(--mut)">Атыңды жаз да, тестті баста.</p><div class="start"><input id="student" placeholder="Оқушының аты-жөні"><button class="pri" onclick="startQuiz()">Бастау →</button></div></section>
<section id="quiz" class="panel hidden"><div class="progrow"><div class="prog"><div id="bar"></div></div><div id="qnum" class="qnum"></div></div><div id="content"></div><div id="fb"></div><div class="acts"><button class="ghost" onclick="restart()">Қайта бастау</button><div class="right"><button id="check" class="pri" onclick="checkAnswer()">Тексеру</button><button id="next" class="pri hidden" onclick="nextQ()">Келесі →</button></div></div></section>
<section id="result" class="panel hidden"><div class="result"><div id="score" class="score"></div><h2 id="title"></h2><p id="rtext" style="color:var(--mut)"></p><div class="acts" style="justify-content:center"><button class="pri" onclick="copyResult()">Нәтижені көшіру</button><button class="ghost" onclick="restart()">Қайта тапсыру</button></div></div></section>
<div class="footer">OilaNIKE • 2025–2026</div>
</div>
<script>
const quiz=[{"type": "single", "q": "Бейэлектролитке жататын заттардың нөмірлері", "stem": "1) NaOH(ер); 2) C₆H₁₂O₆(ер); 3) HCl(ер); 4) BaCl₂(ер); 5) CaCO₃", "options": ["1;2", "2;4", "2;5", "3;5"], "answer": 2, "correct": "C) 2;5", "ex": "Электролиттер суда ерігенде иондарға ыдырайды. C₆H₁₂O₆ суда молекула күйінде қалады, ал CaCO₃ суда өте нашар ериді. Сондықтан тапсырма бойынша 2 және 5 таңдалады."}, {"type": "single", "q": "Натрий фториді ерітіндісінің ортасы және гидролиз түрі", "options": ["pH<7, анионды", "pH>7, катионды", "pH>7, анионды", "pH=7, бірлескен"], "answer": 2, "correct": "C) pH>7, анионды", "ex": "NaF — күшті негіз NaOH пен әлсіз қышқыл HF тұзы. F⁻ + H₂O ⇄ HF + OH⁻. OH⁻ көбейгендіктен орта сілтілік: pH>7."}, {"type": "single", "q": "2 молекула алюминий сульфаты және 1 молекула калий фосфаты ионға ыдырағанда түзілетін аниондар саны", "options": ["8", "7", "6", "4"], "answer": 1, "correct": "B) 7", "ex": "Al₂(SO₄)₃ → 2Al³⁺ + 3SO₄²⁻. Екі молекуладан 6 анион. K₃PO₄ → 3K⁺ + PO₄³⁻, одан 1 анион. Барлығы 7."}, {"type": "single", "q": "Ерітіндіде бір мезгілде бола алмайтын иондар", "options": ["Cr³⁺ және OH⁻", "Ca²⁺ және Cl⁻", "Na⁺ және NO₃⁻", "Ag⁺ және NO₃⁻"], "answer": 0, "correct": "A) Cr³⁺ және OH⁻", "ex": "Cr³⁺ + 3OH⁻ → Cr(OH)₃↓. Тұнба түзілгендіктен бұл иондар ерітіндіде бос күйінде бірге қала алмайды."}, {"type": "single", "q": "Ион алмасу реакциясы жүретін заттар жұбы", "options": ["KOH + H₂SiO₃", "Na₃PO₄ + HNO₃", "Ca(OH)₂ + SO₃", "Na₂SiO₃ + HBr"], "answer": 3, "correct": "D) Na₂SiO₃ + HBr", "ex": "Na₂SiO₃ + 2HBr → H₂SiO₃↓ + 2NaBr. Нашар еритін H₂SiO₃ түзілгендіктен реакция жүреді."}, {"type": "single", "q": "Алюминий сульфиді гидролизіне 54 мл су жұмсалған болса, гидролизге ұшыраған тұз массасы", "options": ["300 г", "150 г", "75 г", "37 г"], "answer": 2, "correct": "C) 75 г", "ex": "Al₂S₃ + 6H₂O → 2Al(OH)₃↓ + 3H₂S↑. 54 г су = 3 моль. 6 моль H₂O-ға 1 моль Al₂S₃, демек 3 моль суға 0,5 моль. m=0,5×150=75 г."}, {"type": "single", "q": "Магний нитраты мен калий гидроксиді арасындағы реакцияның қысқартылған иондық теңдеуіндегі коэффициенттер қосындысы", "options": ["3", "4", "5", "6"], "answer": 1, "correct": "B) 4", "ex": "Mg²⁺ + 2OH⁻ → Mg(OH)₂↓. Коэффициенттер қосындысы: 1+2+1=4."}, {"type": "single", "q": "Темір (III) хлориді гидролизінің III-сатысының толық иондық теңдеуіндегі коэффициенттер қосындысы", "options": ["4", "6", "8", "10"], "answer": 1, "correct": "B) 6", "ex": "III сатыда Fe(OH)₃ түзіледі. Берілген нұсқалар бойынша толық иондық теңдеудегі коэффициенттер қосындысы 6."}, {"type": "single", "q": "Калий сульфатының 0,5 М 500 мл ерітіндісі диссоциацияланғанда 15,6 г калий ионы түзілді. Электролиттің диссоциациялану дәрежесі", "options": ["80%", "77%", "69%", "60%"], "answer": 0, "correct": "A) 80%", "ex": "n(K₂SO₄)=0,5×0,5=0,25 моль. Толық диссоциацияда 0,5 моль K⁺ = 19,5 г. α=15,6/19,5×100%=80%."}, {"type": "single", "q": "250 мл ерітіндіде 0,214 г барий гидроксиді бар. Ерітіндінің pH мәні", "options": ["2", "3", "11", "12"], "answer": 3, "correct": "D) 12", "ex": "n(Ba(OH)₂)=0,214/171≈0,00125 моль. C≈0,005 М. Екі OH⁻ беретіндіктен [OH⁻]≈0,01 М, pOH=2, сондықтан pH=12."}, {"type": "single", "q": "Натрий бромиді мен кальций бромидін бір-бірінен ажыратуға қолданылатын қосылыс", "options": ["тұз қышқылы", "магний гидроксиді", "күміс нитраты", "калий карбонаты"], "answer": 3, "correct": "D) калий карбонаты", "ex": "K₂CO₃ қосқанда Ca²⁺ + CO₃²⁻ → CaCO₃↓ ақ тұнба түзіледі. NaBr ерітіндісінде мұндай тұнба болмайды."}, {"type": "single", "context": "БЕЛГІСІЗ ЗАТТАР: A затын суда ерітіп, Ba(OH)₂ қосқанда B ақ тұнбасы мен өткір иісті C газы бөлінеді. B тұнбасы қышқыл мен сілтіде ерімейді.", "q": "B тұнбасы", "options": ["алюминий гидроксиді", "барий сульфаты", "аммоний хлориді", "аммоний сульфаты"], "answer": 1, "correct": "B) барий сульфаты", "ex": "Өткір иісті газ — NH₃, ал қышқыл мен сілтіде ерімейтін ақ тұнба — BaSO₄. (NH₄)₂SO₄ + Ba(OH)₂ → BaSO₄↓ + 2NH₃↑ + 2H₂O."}, {"type": "multi", "q": "99 г 40%-дық A ерітіндісіне 250 мл 20% Ba(OH)₂ (ρ=1,71 г/мл) қосқанда алынған тұнба массасын, газ көлемін және артық қалған зат массасын таңдаңыз.", "options": ["13,44 л", "22,40 л", "26,4 г", "34,2 г", "41,2 г", "69,9 г"], "answers": [0, 3, 5], "correct": "A, D, F → 13,44 л; 34,2 г; 69,9 г", "ex": "39,6 г (NH₄)₂SO₄ = 0,3 моль. 85,5 г Ba(OH)₂ = 0,5 моль. NH₃: 0,6×22,4=13,44 л; BaSO₄: 0,3×233=69,9 г; артық Ba(OH)₂: 0,2×171=34,2 г."}, {"type": "match", "q": "Литий, кальций, барий иондарының жалындағы түсін сәйкестендіріңіз", "items": ["Li⁺", "Ca²⁺", "Ba²⁺"], "choices": ["көгілдір", "қызыл-кірпіш", "таңқурай", "сары", "сары жасыл", "күлгін"], "answer": [2, 1, 4], "correct": "Li⁺ → таңқурай; Ca²⁺ → қызыл-кірпіш; Ba²⁺ → сары жасыл", "ex": "Жалын сынағында әр металл ионы өзіне тән түс береді: Li⁺ — таңқурай/кармин-қызыл, Ca²⁺ — кірпіш-қызыл, Ba²⁺ — сары-жасыл."}, {"type": "match", "q": "Берілген сутектік көрсеткіш мәні мен тұздарды сәйкестендіріңіз", "items": ["KCl", "CuCl₂", "K₂CO₃", "BaSO₄"], "choices": ["pH=7", "pH<7", "pH>7"], "answer": [0, 1, 2, 0], "correct": "KCl → pH=7; CuCl₂ → pH<7; K₂CO₃ → pH>7; BaSO₄ → pH=7", "ex": "KCl — бейтарап орта. CuCl₂ катиондық гидролизге байланысты қышқыл орта береді. K₂CO₃ аниондық гидролизге байланысты сілтілік орта береді. BaSO₄ бұл тапсырмада pH=7 деп сәйкестендіріледі."}];
let i=0,pts=0,locked=false,name="";
function startQuiz(){name=document.getElementById('student').value.trim()||'Оқушы';start.classList.add('hidden');quizEl.classList.remove('hidden');render()}
const start=document.getElementById('start'),quizEl=document.getElementById('quiz'),result=document.getElementById('result');
function render(){locked=false;const q=quiz[i];qnum.textContent=`${i+1} / ${quiz.length}`;bar.style.width=`${i/quiz.length*100}%`;let h='';if(q.context)h+=`<div class="context">${q.context}</div>`;h+=`<div class="q">${q.q}</div>`;if(q.stem)h+=`<div class="stem">${q.stem}</div>`;if(q.type==='single'||q.type==='multi'){h+='<div class="opts">';q.options.forEach((o,n)=>{const t=q.type==='single'?'radio':'checkbox';h+=`<label class="opt"><input type="${t}" name="ans" value="${n}"><b>${'ABCDEF'[n]}.</b><span>${o}</span></label>`});h+='</div>'}else{h+='<div class="opts">';q.items.forEach((it,n)=>{h+=`<div class="match"><b>${it}</b><select id="m${n}"><option value="">Таңдаңыз</option>`;q.choices.forEach((c,j)=>h+=`<option value="${j}">${c}</option>`);h+='</select></div>'});h+='</div>'}content.innerHTML=h;fb.innerHTML='';check.classList.remove('hidden');next.classList.add('hidden')}
function checkAnswer(){if(locked)return;const q=quiz[i];let good=false,answered=true;if(q.type==='single'){const e=document.querySelector('input[name="ans"]:checked');if(!e)answered=false;else good=+e.value===q.answer}else if(q.type==='multi'){const v=[...document.querySelectorAll('input[name="ans"]:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(!v.length)answered=false;good=answered&&JSON.stringify(v)===JSON.stringify([...q.answers].sort((a,b)=>a-b))}else{const v=q.items.map((_,n)=>document.getElementById('m'+n).value);if(v.some(x=>x===''))answered=false;good=answered&&v.every((x,n)=>+x===q.answer[n])}if(!answered){fb.innerHTML='<div class="fb bad">Алдымен жауапты белгіле.</div>';return}locked=true;if(good)pts++;document.querySelectorAll('input,select').forEach(x=>x.disabled=true);bar.style.width=`${(i+1)/quiz.length*100}%`;fb.innerHTML=`<div class="fb ${good?'ok':'bad'}">${good?'Дұрыс! ✓':'Қате жауап'}</div><div class="exp"><h3>Түсіндірме</h3><div class="correct">Дұрыс жауап: ${q.correct}</div><p>${q.ex}</p></div>`;check.classList.add('hidden');next.classList.remove('hidden')}
function nextQ(){i++;if(i>=quiz.length)return finish();render()}
function finish(){quizEl.classList.add('hidden');result.classList.remove('hidden');const p=Math.round(pts/quiz.length*100);score.textContent=`${pts}/${quiz.length}`;title.textContent=p>=90?'OilaNIKE MASTER':p>=75?'Өте жақсы!':p>=60?'Жақсы нәтиже!':'Тағы бір рет байқап көр!';rtext.textContent=`${name} • ${p}%`}
function restart(){i=0;pts=0;locked=false;quizEl.classList.add('hidden');result.classList.add('hidden');start.classList.remove('hidden')}
async function copyResult(){const p=Math.round(pts/quiz.length*100),t=`OilaNIKE — Химия\nОқушы: ${name}\nНәтиже: ${pts}/${quiz.length} (${p}%)`;try{await navigator.clipboard.writeText(t);alert('Нәтиже көшірілді!')}catch(e){prompt('Көшіріп алыңыз:',t)}}
</script></body></html>
